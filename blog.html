<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Brendan's Blog | Cybersecurity Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css?family=Raleway:400,700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css?family=Fira+Mono:400,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <button class="menu-btn" onclick="openSidebar()">☰</button>
  <nav class="sidebar" id="sidebar">
    <button class="close-btn" onclick="closeSidebar()">✕</button>
    <a href="index.html" onclick="closeSidebar()">Home</a>
    <a href="contact.html" onclick="closeSidebar()">Contact</a>
  </nav>
  <div class="banner">
    <span style="color:#fff;">Brendan's</span> Blog
    <span class="banner-terminal">$ cat blog.txt</span>
  </div>
  <main class="container" id="blog-feed">
    <!-- Blog posts will be rendered here by JS -->
  </main>
  <div id="blog-overlay" class="blog-overlay" style="display:none;">
    <div class="blog-overlay-content">
      <button class="blog-overlay-close" onclick="closePost()">✕</button>
      <h2 id="overlay-title"></h2>
      <div class="blog-meta">
        <span id="overlay-date" class="blog-date"></span>
        <span id="overlay-tag" class="blog-tag"></span>
      </div>
      <div id="overlay-content" class="blog-overlay-body"></div>
    </div>
  </div>
  <footer>
    <a href="index.html">Previous</a>
    <a href="contact.html">Next »</a>
    <div>© 2025 Brendan Lewis - All Rights Reserved.</div>
  </footer>
  <script>
    // Sidebar logic
    function openSidebar() {
      document.getElementById('sidebar').style.display = 'block';
    }
    function closeSidebar() {
      document.getElementById('sidebar').style.display = 'none';
    }
    window.addEventListener('click', function(e) {
      const sidebar = document.getElementById('sidebar');
      if (sidebar.style.display === 'block' && !sidebar.contains(e.target) && !e.target.classList.contains('menu-btn')) {
        sidebar.style.display = 'none';
      }
    });

    // Blog posts data
    const blogPosts = [
      {
        title: "How I Got Started in Cybersecurity",
        date: "August 12, 2025",
        tag: "#journey",
        preview: "My journey into cybersecurity began with curiosity and a desire to understand how systems work—and how they break. From tinkering with Linux to exploring CTFs, every step has been a learning experience. In this post, I share the resources, communities, and mindsets that helped me get started.",
        content: `My journey into cybersecurity began with curiosity and a desire to understand how systems work—and how they break. From tinkering with Linux to exploring CTFs, every step has been a learning experience. In this post, I share the resources, communities, and mindsets that helped me get started.
        <br><br><strong>Key Takeaways:</strong>
        <ul>
          <li>Start with curiosity and a willingness to learn.</li>
          <li>Participate in CTFs and online communities.</li>
          <li>Never stop exploring new tools and techniques.</li>
        </ul>`
      },
      {
        title: "Top 5 Tools Every Ethical Hacker Should Know",
        date: "August 1, 2025",
        tag: "#tools",
        preview: "From Nmap to Burp Suite, these are the essential tools I use in my daily workflow. Learn what they do, why they matter, and how to get started with each.",
        content: `From Nmap to Burp Suite, these are the essential tools I use in my daily workflow. Learn what they do, why they matter, and how to get started with each.
        <br><br><strong>My Top 5:</strong>
        <ol>
          <li>Nmap</li>
          <li>Burp Suite</li>
          <li>Metasploit</li>
          <li>Wireshark</li>
          <li>John the Ripper</li>
        </ol>`
      },
      {
        title: "Why Cyber Hygiene Matters",
        date: "July 20, 2025",
        tag: "#basics",
        preview: "Good cyber hygiene is the foundation of security. In this post, I discuss simple habits that can prevent most attacks and keep your data safe.",
        content: `Good cyber hygiene is the foundation of security. In this post, I discuss simple habits that can prevent most attacks and keep your data safe.
        <br><br><ul>
          <li>Use strong, unique passwords.</li>
          <li>Keep your software updated.</li>
          <li>Be wary of phishing attempts.</li>
        </ul>`
      },
      // Add more posts here as needed
    ];

    // Pagination logic
    const postsPerPage = 3;
    let currentPage = 1;

    function renderPosts(page) {
      const feed = document.getElementById('blog-feed');
      feed.innerHTML = '';
      const start = (page - 1) * postsPerPage;
      const end = start + postsPerPage;
      const postsToShow = blogPosts.slice(start, end);

      postsToShow.forEach(post => {
        const article = document.createElement('article');
        article.className = 'blog-post';
        article.innerHTML = `
          <h2 class="blog-title">${post.title}</h2>
          <div class="blog-meta">
            <span class="blog-date">${post.date}</span>
            <span class="blog-tag">${post.tag}</span>
          </div>
          <p>${post.preview}</p>
          <a class="blog-readmore" href="#" onclick="openPostFromList('${post.title.replace(/'/g,"\\'")}');return false;">Read more →</a>
        `;
        feed.appendChild(article);
      });

      // Pagination controls
      const totalPages = Math.ceil(blogPosts.length / postsPerPage);
      let pagination = `<div class="blog-pagination">`;
      pagination += `<a href="#" class="blog-page${page === 1 ? ' blog-page-disabled' : ''}" onclick="gotoPage(${page-1});return false;">«</a>`;
      for (let i = 1; i <= totalPages; i++) {
        pagination += `<a href="#" class="blog-page${i === page ? ' blog-page-active' : ''}" onclick="gotoPage(${i});return false;">${i}</a>`;
      }
      pagination += `<a href="#" class="blog-page${page === totalPages ? ' blog-page-disabled' : ''}" onclick="gotoPage(${page+1});return false;">»</a>`;
      pagination += `</div>`;
      feed.innerHTML += pagination;
    }

    function gotoPage(page) {
      const totalPages = Math.ceil(blogPosts.length / postsPerPage);
      if (page < 1 || page > totalPages) return;
      currentPage = page;
      renderPosts(currentPage);
    }

    // Overlay logic
    function openPostFromList(title) {
      const post = blogPosts.find(p => p.title === title);
      if (!post) return;
      document.getElementById('overlay-title').textContent = post.title;
      document.getElementById('overlay-date').textContent = post.date;
      document.getElementById('overlay-tag').textContent = post.tag;
      document.getElementById('overlay-content').innerHTML = post.content;
      document.getElementById('blog-overlay').style.display = 'flex';
      document.body.classList.add('no-scroll');
    }
    function closePost() {
      document.getElementById('blog-overlay').style.display = 'none';
      document.body.classList.remove('no-scroll');
    }
    document.addEventListener('keydown', function(e) {
      if (e.key === "Escape") closePost();
    });
    document.getElementById('blog-overlay').addEventListener('click', function(e) {
      if (e.target === this) closePost();
    });

    // Expose for inline onclick
    window.gotoPage = gotoPage;
    window.openPostFromList = openPostFromList;

    // Initial render
    renderPosts(currentPage);
  </script>
</body>
</html>
